name: Rappi y Pedidos Ya diario

# Lee los precios de Rappi / Pedidos Ya del reporte de Trade Marketing (Firebase de Sol)
# y los guarda en delivery.json para la pestaña Online del dashboard.

on:
  schedule:
    - cron: '0 22 * * *'   # 19:00 Argentina
  workflow_dispatch:       # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: delivery
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar lector de Firebase
        run: pip install google-cloud-firestore==2.16.1
      - name: Traer precios de Rappi y Pedidos Ya
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: python delivery_update.py
      - name: Guardar cambios
        run: |
          git config user.name "delivery-bot"
          git config user.email "delivery-bot@users.noreply.github.com"
          git add delivery.json
          if git diff --cached --quiet; then
            echo "Sin datos nuevos"
          else
            git commit -m "Rappi/Pedidos Ya: actualización $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
